name: copy-lint

# 55-13: English/Arabic copy rules over the web message catalogs. Plain Node, no install needed
# for the lint itself; the unit test needs the workspace dev dependencies.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  copy-lint:
    name: copy lint (en.json / ar.json)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: copy lint
        run: node scripts/i18n/copy-lint.mjs

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: copy lint unit test
        run: pnpm exec vitest run scripts/i18n/copy-lint.test.mjs
